[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-flashback"
version = "1.0.0"
description = "Local analytics and a reader for Facebook Messenger exports: yearly recaps, member personalities, reaction dynamics, response speed, sentiment, word clouds, running jokes, and an on-this-day chat reader."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "matplotlib>=3.7",
    "emoji>=2.0",
    "better-profanity>=0.7",
    "tzdata>=2023.3; platform_system == 'Windows'",
]

[project.optional-dependencies]
full = ["vaderSentiment>=3.3", "wordcloud>=1.9"]
dev = ["pytest>=7"]

[project.scripts]
chatflashback = "analyze_chat:main"

[tool.setuptools]
py-modules = ["analyze_chat", "chat_ui"]
